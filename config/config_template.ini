exclude = Ordnername Rohdaten,Name des Ordners,Data Location,Folder Name,Filename, Name of the file
mapping_specimen_description = Probe
mapping_person = Experimentator
mapping_date = Datum und Uhrzeit

[Excel-local]
type = upload

